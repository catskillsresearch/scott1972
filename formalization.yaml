# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Scott 1972 Continuous Lattices — Theorem 4.4"
  description: >-
    A Lean 4 / mathlib formalization of Dana Scott's 1972 paper *Continuous
    Lattices* (LNM 274), through the Milner correction (pp. 135–136). The
    Palomar compared result is Theorem 4.4 as worded in
    sources/ScottContinLatt1972.md: the inverse limit D_∞ of the recursively
    defined sequence ⟨D_n, j_n⟩ of function spaces is not only a continuous
    lattice, but it is also homeomorphic to its own function space
    [D_∞ → D_∞]. The compared Homeomorph explicitly uses the product/subspace
    topology on the inverse limit and the pointwise Pi topology on the function
    space. The full paper development
    (injectivity, Scott topology, way-below, function spaces, inverse limits)
    lives in Scott1972/ContinuousLattice/*. The informal account is arxiv.md
    and sources/ScottContinLatt1972.md in this repository. Lean was written
    by AI agents under the direction and review of the author. Dana Scott did
    not participate in or endorse this formalization. There is no sorry
    outside the deliberate holes in Challenge.lean, no project-defined axiom,
    and Mathlib is the only Lake dependency.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [math.LO, math.GN]
  msc2020: ["06B35", "54H99", "03B40"]

status:
  scope: >-
    Complete for the compared claim and the underlying Scott1972 library it
    uses. Theorem 4.4 is the compared declaration theorem_4_4: for a
    continuous lattice D₀ and projection j₀, the inverse limit D_∞ of the
    function-space tower is a continuous lattice homeomorphic to [D_∞ → D_∞].
    The Homeomorph names Scott's product/subspace inverse-limit topology and
    Definition 3.1 pointwise function-space topology explicitly. Challenge.lean
    fixes the function-space lattice by pointwise order and pointwise suprema,
    the inverse-limit lattice by coordinatewise order and infima, and the
    projection tower by the recursive Proposition 3.7 conjugation formulas.
    The broader paper (Theorems 2.12, 3.3, 4.1, etc.) is formalized in the
    same library but is not part of the advertised Comparator result; the
    additional Comparator theorem targets are proof obligations used only to
    lock these concrete definition bodies.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Scott1972.ContinuousLattice.theorem_4_4"
      file: "Scott1972/ContinuousLattice/FunctionSpaceTower.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    Working source: sources/ScottContinLatt1972.md. Theorem 4.4 there is
    quoted in Challenge.lean and as theorem_4_4. Lean DInf is the inverse
    limit of the recursively defined sequence ⟨D_n, j_n⟩ of function spaces
    (D_{n+1} = [D_n → D_n], j_{n+1} = [j_n → j_n], D_0 and j_0 given as in
    the paragraph above 4.4). Definition 3.1 takes [X → Y] with the product
    topology, represented by scottMapInducedPiTopology. The inverse limit uses
    inverseLimitTopology, the subspace topology induced from the Pi product of
    the stage Scott topologies. Proposition 4.1 follows Scott's route:
    coordinatewise maximal extensions from Proposition 3.8 are made compatible
    by Lemma 3.9, yielding injectivity, and Theorem 2.12 supplies both the
    continuous-lattice result and the topology identification. Lemma 4.5 follows
    Scott's induction after moving a projection through a directed supremum.
    The source-topology homeomorphism uses Scott's formulas
    i_∞(x) = ⨆ₙ (i_{n∞} ∘ x_{n+1} ∘ j_{∞n}) and
    j_∞(f) = ⨆ₙ i_{(n+1)∞}(j_{∞n} ∘ f ∘ i_{n∞}).
    Theorem 3.3 identifies the pointwise function topology with the lattice
    Scott topology. The abstract's extra “and isomorphic” is
    theorem_4_4_orderIso and is not the numbered theorem.

sources:
  - title: "Continuous Lattices"
    authors: ["Dana S. Scott"]
    type: "article"
    location: "In: Toposes, Algebraic Geometry and Logic, edited by F. W. Lawvere, LNM 274, Springer-Verlag, 1972, pp. 97–136. Theorem 4.4."
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Primary source. Dana Scott was not contacted and did not participate
      in or endorse this formalization. The compared claim is Theorem 4.4.
      Working OCR text: sources/ScottContinLatt1972.md. Narrative inventory:
      arxiv.md.

  - title: "A Lean 4 Formalization of Scott's Continuous Lattices (1972)"
    authors: ["Lars Warren Ericson"]
    type: "article"
    id: "https://arxiv.org/abs/2606.30782"
    relationship: other
    author_endorsement: participated
    note: >-
      The author's write-up of this formalization, not the 1972 source paper.

  - title: "Continuous Lattices (Milner correction)"
    authors: ["Robin Milner"]
    type: "article"
    location: "LNM 274, pp. 135–136 (March 1972 correction)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      March 1972 correction to Proposition 2.10; formalized in
      MilnerCorrection.lean. Used in inverse-limit and retraction arguments
      underlying Theorem 4.4. Milner was not contacted.

related_formalizations:
  - id: "https://github.com/catskillsresearch/scott_models"
    relationship: other
    note: >-
      Same-author sibling with cross-presentation equivalence theorems for
      Scott 1972 / 1980 / 1982. That Palomar entry was withdrawn after a
      registration glitch; this repository is an independent submission for
      the 1972 paper alone. See PROVENANCE.md.

  - id: "https://github.com/catskillsresearch/scott1980"
    relationship: other
    note: "Same-author formalization of Scott PRG-19 (1980); not imported here."

  - id: "https://github.com/catskillsresearch/scott1982"
    relationship: other
    note: "Same-author formalization of Scott 1982 information systems; not imported here."

automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.6 High Fast (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Primary agent for Lean 4 / mathlib formalization, lake build repair,
        vision-OCR transcription, and arxiv.md drafting.
    - method: agent
      models: ["Cursor Composer 2.5 Fast"]
      framework: "Cursor"
      role: "Routine scaffolding and medium-complexity proof obligations."
    - method: agent
      models: ["Anthropic Claude Sonnet 5 (medium reasoning)"]
      framework: "Cursor"
      role: "Day-to-day formalization and proof-engineering."
    - method: agent
      models: ["Anthropic Claude Opus 4.8 (high reasoning)"]
      framework: "Cursor"
      role: >-
        Heaviest proof work including Theorem 2.12, Theorem 3.3, and
        Theorem 4.4.
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviewed every definition
        and claim, and takes sole responsibility for the mathematical content.
        Dana Scott was not consulted.
  notes: >-
    Palomar Challenge / Solution / comparator / formalization.yaml packaging
    was added under the author's direction, following the cardb template.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development. No external review of
    the Lean source, and no review or endorsement by Dana Scott. Every proof
    step is checked by the Lean kernel.

known_gaps: []

limitations:
  - >-
    The historical introduction treats Scott's D_∞ construction as a landmark
    early model but does not establish comparative priority over other early
    models of the untyped lambda calculus.
  - >-
    The Comparator-compared family is Theorem 4.4 and the definitions it
    mentions, not the full Scott 1972 inventory in arxiv.md.
  - >-
    The compared theorem depends on propext, Classical.choice, and Quot.sound.
    Classical.choice enters via Scott-open sets and non-decidable predicates.
  - >-
    Challenge.lean states the claim with deliberate sorries; Solution.lean and
    Scott1972/ContinuousLattice/* supply the proofs.

alignment:
  namespace: "Scott1972.ContinuousLattice"
  statements:
    - source: >-
        sources/ScottContinLatt1972.md, Theorem 4.4: The inverse limit D_∞ of
        the recursively defined sequence ⟨D_n, j_n⟩_{n=0}^∞ of function spaces
        is not only a continuous lattice, but it is also homeomorphic to its
        own function space [D_∞ → D_∞].
      lean: "theorem_4_4"
      module: "Challenge (statement), FunctionSpaceTower.lean (proof)"
      status: proved
      note: >-
        Challenge quotes that sentence. The library proves it via Proposition
        4.1 and the maps i_∞, j_∞ written in the proof of 4.4. Its explicit
        Homeomorph uses inverseLimitTopology and scottMapInducedPiTopology.

    - source: "Scott 1972, Definition 2.3: continuous lattice"
      lean: "IsContinuousLattice"
      module: "Challenge (definition), WayBelow.lean (proof development)"
      status: proved
      note: "Compared as a definition."

    - source: "Scott 1972, §2: way-below relation x ≪ y"
      lean: "WayBelow"
      module: "Challenge (definition), WayBelow.lean"
      status: proved
      note: "Compared as a definition."

    - source: "Scott 1972, §2: Scott-open sets"
      lean: "ScottOpen"
      module: "Challenge (definition), WayBelow.lean"
      status: proved
      note: "Compared as a definition."

    - source: >-
        sources/ScottContinLatt1972.md, Definition 3.1: [X → Y] is the space of
        all continuous functions f : X → Y endowed with the product topology
        (pointwise convergence). Theorem 3.3: on continuous lattices the lattice
        topology agrees with the product topology.
      lean: "ScottMap"
      module: "Challenge (definition), FunctionSpaces.lean"
      status: proved
      note: "Compared as a definition."

    - source: "Scott 1972, Theorem 3.3: [D → D'] is a complete lattice"
      lean: "ScottMap.instCompleteLattice"
      module: "Challenge (concrete construction), FunctionSpaces.lean (proof)"
      status: proved
      note: >-
        Comparator checks the concrete body generated from pointwise order
        (including its explicitly defined strict relation) and pointwise arbitrary
        suprema. The pointwise order laws, strict-order characterization,
        continuity, and least-upper-bound obligations are theorem holes in Challenge.

    - source: "Scott 1972, §2: induced (Scott) topology on a lattice"
      lean: "scottTopologicalSpace"
      module: "Challenge (definition), Specialization.lean"
      status: proved
      note: "Compared as a definition."

    - source: "Scott 1972, Definition 3.6: retraction / projection"
      lean: "IsContinuousLatticeProjection"
      module: "Challenge (definition), FunctionSpaces.lean"
      status: proved
      note: >-
        Structure compared via the theorem-type worklist, not as a
        definition hole (Comparator only accepts defs in definition_names).

    - source: "Scott 1972, §4: inverse limit of compatible sequences"
      lean: "InverseLimit"
      module: "Challenge (definition), InverseLimits.lean"
      status: proved
      note: "Compared as a definition."

    - source: >-
        Scott 1972, §4: inverse limit as a subspace of the product of the D_n
      lean: "inverseLimitTopology"
      module: "Challenge (definition), InverseLimits.lean"
      status: proved
      note: "Compared as a definition."

    - source: >-
        Scott 1972, Definition 3.1: pointwise product topology on [D → D']
      lean: "scottMapInducedPiTopology"
      module: "Challenge (definition), FunctionSpaces.lean"
      status: proved
      note: "Compared as a definition."

    - source: "Scott 1972, §4: function-space tower D_{n+1} = [D_n → D_n]"
      lean: "DInf"
      module: "Challenge (definition), FunctionSpaceTower.lean"
      status: proved
      note: "DInf is the inverse limit of the tower; DInfFn is [D_∞ → D_∞]."
